name: native-probes

# Native runtime qualification for the Crystal process-supervision kit in probes/.
# Linux is intentionally absent: the kit has no Linux native lane (its cgroup work is a separate lane).

on:
  workflow_dispatch:
  push:
    paths:
      - "probes/**"
      - ".github/workflows/native-probes.yml"

permissions:
  contents: read

env:
  CRYSTAL_VERSION: "1.21.1"

jobs:
  windows-x64:
    name: Windows x64 (Crystal MSVC)
    # Windows Server 2025 image: x64, Visual Studio 2022 Enterprise with VC tools,
    # Windows SDK 10.0.26100, Python, Git. Pinned rather than windows-latest.
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Log runner identity and elevation
        run: |
          $id = [Security.Principal.WindowsIdentity]::GetCurrent()
          $p  = New-Object Security.Principal.WindowsPrincipal($id)
          "user=$($id.Name)"
          "elevated=$($p.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator))"
          # The probe README asks for a non-elevated run. Hosted runners may be
          # elevated; this step records which case this run was.

      - name: Enable Developer Mode (Crystal MSVC prerequisite)
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v AllowDevelopmentWithoutDevLicense /d 1

      - name: Activate MSVC build environment
        # The image has VS 2022 with VC tools, but link.exe is only on PATH after vcvars64.
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "No Visual Studio install with VC tools found" }
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          cmd /c "`"$vcvars`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }

      - name: Install Crystal ${{ env.CRYSTAL_VERSION }}
        run: |
          $url = "https://github.com/crystal-lang/crystal/releases/download/$env:CRYSTAL_VERSION/crystal-$env:CRYSTAL_VERSION-windows-x86_64-msvc-unsupported.zip"
          # SHA-256 computed from this release asset when the workflow was drafted.
          # Upstream does not publish a checksum file we could verify against.
          $expected = "696db553299ca120100c0d81682e2aa78d6d230a1e176623e8f2b43d7149163d"
          Invoke-WebRequest -Uri $url -OutFile crystal.zip
          $actual = (Get-FileHash crystal.zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "Crystal zip hash mismatch: $actual" }
          Expand-Archive -Path crystal.zip -DestinationPath C:\crystal
          "C:\crystal" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          # The zip bundles gc, pcre2, yaml, libxml2, OpenSSL, zlib, LLVM-C and their .lib files.

      - name: Verify toolchain
        run: |
          crystal --version
          cl 2>&1 | Select-Object -First 1
          link /? 2>&1 | Select-Object -First 1

      - name: Run native probes
        working-directory: probes
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\run-windows.ps1

      - name: Upload Windows probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-probe-output
          path: |
            probes/windows-probe-output/
            probes/windows-probe-handback.zip
          if-no-files-found: warn
          retention-days: 30

  macos-arm64:
    name: macOS arm64 (Crystal universal)
    # macos-15 is Apple Silicon (arm64). Xcode CLT (clang) and Python 3 are preinstalled.
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Crystal ${{ env.CRYSTAL_VERSION }}
        run: |
          set -euo pipefail
          url="https://github.com/crystal-lang/crystal/releases/download/${CRYSTAL_VERSION}/crystal-${CRYSTAL_VERSION}-1-darwin-universal.tar.gz"
          # SHA-256 computed from this release asset when the workflow was drafted.
          echo "ba34fa7fb8bc8b951f12d17e12f69c9d7ccce38900caa4b8a17f1b4f29d37605  crystal.tar.gz" > expected.sha256
          curl -fsSL -o crystal.tar.gz "$url"
          shasum -a 256 -c expected.sha256
          tar -xzf crystal.tar.gz -C "$HOME"
          echo "$HOME/crystal-${CRYSTAL_VERSION}-1/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          export PATH="$HOME/crystal-${CRYSTAL_VERSION}-1/bin:$PATH"
          crystal --version
          clang --version | head -1
          python3 --version

      - name: Run native probes
        working-directory: probes
        run: sh ./run-macos.sh

      - name: Upload macOS probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-probe-output
          path: |
            probes/macos-probe-output/
            probes/macos-probe-handback.zip
          if-no-files-found: warn
          retention-days: 30
