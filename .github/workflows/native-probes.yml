name: native-probes

# Native runtime qualification for the Crystal process-supervision kit in probes/, plus
# standalone exploration probes in explore/ that record raw OS behaviour for the questions
# the kit raised but could not settle. Linux is intentionally absent: the kit has no Linux
# native lane (its cgroup work is a separate lane).

on:
  workflow_dispatch:
  push:
    paths:
      - "probes/**"
      - "explore/**"
      - ".github/workflows/native-probes.yml"
      - ".github/actions/**"

permissions:
  contents: read

env:
  CRYSTAL_VERSION: "1.21.1"

jobs:
  # Hosted Windows runners run as an elevated administrator (runneradmin). The kit says
  # "never run elevated", so this job is the as-shipped baseline and the next one is the
  # contract-conforming run.
  windows-x64:
    name: Windows x64 - elevated (as runner provides)
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Log runner identity and elevation
        run: |
          $id = [Security.Principal.WindowsIdentity]::GetCurrent()
          $p  = New-Object Security.Principal.WindowsPrincipal($id)
          "user=$($id.Name)"
          "elevated=$($p.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator))"

      - uses: ./.github/actions/setup-crystal-windows

      - name: Build exploration probe
        run: |
          New-Item -ItemType Directory -Force explore-out | Out-Null
          crystal build --no-color explore/windows/job_explore.cr -o explore-out/job_explore.exe

      - name: Run native probes (kit)
        working-directory: probes
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\run-windows.ps1

      - name: Explore job-object behaviour
        if: always()
        run: |
          $exe = (Resolve-Path explore-out\job_explore.exe).Path
          foreach ($e in "token", "priority", "notify", "cpu-time") {
            & $exe $e > "explore-out\windows-elevated-$e.jsonl" 2> "explore-out\windows-elevated-$e.err"
            "$e exit=$LASTEXITCODE"
          }

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-elevated-output
          path: |
            probes/windows-probe-output/
            probes/windows-probe-handback.zip
            explore-out/*.jsonl
            explore-out/*.err
          if-no-files-found: warn
          retention-days: 30

  # Same kit, run with a UAC-style filtered token (admin groups deny-only, privileges
  # stripped, Medium integrity), which is what "non-elevated" means for an admin account.
  windows-x64-unelevated:
    name: Windows x64 - unelevated (filtered token)
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-crystal-windows

      - name: Build exploration probe
        run: |
          New-Item -ItemType Directory -Force explore-out | Out-Null
          crystal build --no-color explore/windows/job_explore.cr -o explore-out/job_explore.exe

      - name: Self-check the unelevated launcher
        id: selfcheck
        run: |
          $exe = (Resolve-Path explore-out\job_explore.exe).Path
          & $exe launch-unelevated -- $exe token > explore-out\windows-unelevated-token.jsonl 2> explore-out\windows-unelevated-token.err
          "launcher exit=$LASTEXITCODE"
          Get-Content explore-out\windows-unelevated-token.jsonl
          Get-Content explore-out\windows-unelevated-token.err -ErrorAction SilentlyContinue
          $t = Get-Content explore-out\windows-unelevated-token.jsonl | Select-Object -First 1 | ConvertFrom-Json
          if ($null -eq $t) { throw "launcher produced no token record" }
          if ($t.token_is_elevated -ne 0) { throw "launcher produced an elevated token" }

      - name: Run native probes (kit, unelevated)
        if: always() && steps.selfcheck.outcome == 'success'
        working-directory: probes
        run: |
          $exe = (Resolve-Path ..\explore-out\job_explore.exe).Path
          & $exe launch-unelevated -- pwsh -NoProfile -ExecutionPolicy Bypass -File .\run-windows.ps1
          exit $LASTEXITCODE

      - name: Explore job-object behaviour (unelevated)
        if: always() && steps.selfcheck.outcome == 'success'
        run: |
          $exe = (Resolve-Path explore-out\job_explore.exe).Path
          foreach ($e in "priority", "notify", "cpu-time") {
            & $exe launch-unelevated -- $exe $e > "explore-out\windows-unelevated-$e.jsonl" 2> "explore-out\windows-unelevated-$e.err"
            "$e exit=$LASTEXITCODE"
          }

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-unelevated-output
          path: |
            probes/windows-probe-output/
            probes/windows-probe-handback.zip
            explore-out/*.jsonl
            explore-out/*.err
          if-no-files-found: warn
          retention-days: 30

  macos-arm64:
    name: macOS arm64 (Crystal universal)
    # macos-15 is Apple Silicon (arm64). Xcode CLT (clang) and Python 3 are preinstalled.
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Crystal ${{ env.CRYSTAL_VERSION }}
        run: |
          set -euo pipefail
          url="https://github.com/crystal-lang/crystal/releases/download/${CRYSTAL_VERSION}/crystal-${CRYSTAL_VERSION}-1-darwin-universal.tar.gz"
          # SHA-256 computed from this release asset when the workflow was drafted.
          echo "ba34fa7fb8bc8b951f12d17e12f69c9d7ccce38900caa4b8a17f1b4f29d37605  crystal.tar.gz" > expected.sha256
          curl -fsSL -o crystal.tar.gz "$url"
          shasum -a 256 -c expected.sha256
          tar -xzf crystal.tar.gz -C "$HOME"
          echo "$HOME/crystal-${CRYSTAL_VERSION}-1/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          export PATH="$HOME/crystal-${CRYSTAL_VERSION}-1/bin:$PATH"
          crystal --version
          clang --version | head -1
          python3 --version
          sw_vers

      - name: Run native probes (kit)
        working-directory: probes
        run: sh ./run-macos.sh

      - name: Explore process-group signalling
        if: always()
        run: |
          mkdir -p explore-out
          clang -O1 -Wall -Wextra -o explore-out/signal_matrix explore/macos/signal_matrix.c
          ./explore-out/signal_matrix > explore-out/macos-signal-matrix.jsonl
          wc -l explore-out/macos-signal-matrix.jsonl

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-output
          path: |
            probes/macos-probe-output/
            probes/macos-probe-handback.zip
            explore-out/*.jsonl
          if-no-files-found: warn
          retention-days: 30
