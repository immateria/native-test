name: explore-matrix

# Standalone exploration probes (explore/) across OS versions and CPU architectures. Nothing here
# asserts: every probe writes JSON lines describing what the OS did, and the jobs only fail if a
# probe cannot be built at all. The kit's qualification runs stay in native-probes.yml.

on:
  workflow_dispatch:
  push:
    paths:
      - "explore/posix/**"
      - "explore/linux/**"
      - "explore/macos/**"
      - "explore/windows/**"
      - ".github/workflows/explore-matrix.yml"

permissions:
  contents: read

env:
  CRYSTAL_VERSION: "1.21.1"

jobs:
  posix:
    name: POSIX ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-14
          - macos-15
          - macos-15-intel
          - macos-26
          - macos-26-intel
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Crystal ${{ env.CRYSTAL_VERSION }}
        # used only by crystal_spawn.cr; a failure here leaves the C probes to run on their own
        continue-on-error: true
        run: |
          set -euo pipefail
          base="https://github.com/crystal-lang/crystal/releases/download/${CRYSTAL_VERSION}"
          case "$(uname -s)-$(uname -m)" in
            Darwin-*)       asset="crystal-${CRYSTAL_VERSION}-1-darwin-universal.tar.gz"; sum=ba34fa7fb8bc8b951f12d17e12f69c9d7ccce38900caa4b8a17f1b4f29d37605 ;;
            Linux-x86_64)   asset="crystal-${CRYSTAL_VERSION}-1-linux-x86_64.tar.gz";     sum=08b5779df8cf280c4a799599862bbe4d42103ba082aa73429562713c8a9f3b43 ;;
            Linux-aarch64)  asset="crystal-${CRYSTAL_VERSION}-1-linux-aarch64.tar.gz";    sum=a37365b79f58d4cd32b6113bbb9983e21eb41d233667e003c019520e3c245e49 ;;
            *) echo "no Crystal build for $(uname -sm)"; exit 1 ;;
          esac
          # SHA-256 values computed from the release assets when this workflow was written.
          curl -fsSL -o crystal.tar.gz "$base/$asset"
          echo "$sum  crystal.tar.gz" | shasum -a 256 -c -
          tar -xzf crystal.tar.gz -C "$HOME"
          echo "$HOME/crystal-${CRYSTAL_VERSION}-1/bin" >> "$GITHUB_PATH"

      - name: Platform
        run: |
          uname -a
          id
          cc --version | head -1
          command -v crystal && crystal --version | head -1 || echo "crystal: not installed"
          if command -v sw_vers > /dev/null; then sw_vers; else cat /etc/os-release | head -4; fi
          ulimit -a

      - name: POSIX probes
        run: sh explore/posix/run.sh explore-out

      # Which crash handler a crashing child waits for, and whether RLIMIT_CORE=1 made the kernel skip it (the kernel
      # logs "has RLIMIT_CORE set to 1 / Aborting core" for every such crash).
      - name: Linux crash handler details
        if: runner.os == 'Linux'
        run: |
          {
            echo "core_pattern: $(cat /proc/sys/kernel/core_pattern)"
            echo "core_pipe_limit: $(cat /proc/sys/kernel/core_pipe_limit)"
            echo "== coredump.conf"; systemd-analyze cat-config systemd/coredump.conf 2>/dev/null | grep -v '^#' | grep . || cat /etc/systemd/coredump.conf 2>/dev/null
            echo "== systemd-coredump: $(systemd-coredump --version 2>/dev/null | head -1 || /usr/lib/systemd/systemd-coredump --version 2>/dev/null | head -1)"
            echo "== kernel log lines about RLIMIT_CORE=1: $(sudo dmesg | grep -c 'has RLIMIT_CORE set to 1')"
            sudo dmesg | grep -E 'RLIMIT_CORE set to 1|Aborting core|over core_pipe_limit' | tail -6
            echo "== coredumpctl (last 8)"; coredumpctl list --no-pager 2>/dev/null | tail -8
          } > explore-out/linux-crash-handler-details.txt 2>&1
          cat explore-out/linux-crash-handler-details.txt

      - name: macOS Mach exception ports holding a faulting thread
        if: runner.os == 'macOS'
        run: |
          tag="posix-$(uname -s)-$(uname -m)"
          cc -O1 -Wall -Wextra -pthread -o explore-out/build/mach_exc explore/macos/mach_exc.c
          ./explore-out/build/mach_exc > "explore-out/$tag-mach_exc.jsonl" 2> "explore-out/$tag-mach_exc.err" || true
          cat "explore-out/$tag-mach_exc.jsonl"

      - name: Process-group signalling matrix and kqueue zombie registration
        run: |
          tag="posix-$(uname -s)-$(uname -m)"
          cc -O1 -Wall -Wextra -o explore-out/build/signal_matrix explore/macos/signal_matrix.c
          ./explore-out/build/signal_matrix > "explore-out/$tag-signal_matrix.jsonl"
          cc -O1 -Wall -Wextra -o explore-out/build/kqueue_zombie explore/macos/kqueue_zombie.c
          ./explore-out/build/kqueue_zombie > "explore-out/$tag-kqueue_zombie.jsonl"
          wc -l explore-out/*.jsonl

      - name: macOS memory limits (as the runner user, then as root)
        if: runner.os == 'macOS'
        run: |
          tag="posix-$(uname -s)-$(uname -m)"
          cc -O1 -Wall -Wextra -o explore-out/build/memory_limits explore/macos/memory_limits.c
          ./explore-out/build/memory_limits > "explore-out/$tag-memory_limits.jsonl" || true
          sudo -n ./explore-out/build/memory_limits > "explore-out/$tag-memory_limits-root.jsonl" || true
          wc -l explore-out/*memory_limits*.jsonl

      # Ubuntu 22.04 (glibc 2.35, kernel 6.8) gave EPERM from posix_spawn under RLIMIT_NPROC, 24.04 (glibc 2.39,
      # kernel 7.0) EAGAIN. Run the case with both releases' glibc on this runner's kernel to see which one matters.
      # seccomp is unconfined because Docker's default profile changes how glibc can create the child (clone3).
      - name: glibc vs kernel - posix_spawn errno under RLIMIT_NPROC
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          kernel=$(uname -r)
          for rel in 22.04 24.04; do
            bin="explore-out/build/rlimit-glibc-ubuntu-$rel"
            docker run --rm --security-opt seccomp=unconfined -v "$PWD":/w -w /w "ubuntu:$rel" sh -c \
              "apt-get update -qq > /dev/null && apt-get install -y -qq gcc libc6-dev > /dev/null && cc -O1 -o /w/$bin explore/posix/rlimit.c && ldd --version | head -1" \
              || { echo "container build failed for $rel"; continue; }
            out="explore-out/posix-Linux-x86_64-nproc-glibc-of-ubuntu-$rel-on-kernel-$kernel.jsonl"
            docker run --rm --security-opt seccomp=unconfined --user "$(id -u):$(id -g)" -v "$PWD":/w -w /w "ubuntu:$rel" "/w/$bin" --only nproc > "$out" 2>&1 || true
            echo "== ubuntu:$rel userland on kernel $kernel"; cat "$out"
          done

      - name: Show results
        if: always()
        run: |
          for f in explore-out/*.jsonl; do echo "=== $f"; cut -c1-600 "$f"; done
          for f in explore-out/*.err; do [ -s "$f" ] && { echo "=== $f"; head -c 3000 "$f"; }; done
          exit 0

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: posix-${{ matrix.runner }}
          path: |
            explore-out/*.jsonl
            explore-out/*.err
            explore-out/*.txt
          if-no-files-found: warn
          retention-days: 30

  # Linux-specific supervision: cgroup v2 (with a subtree delegated to the unprivileged runner user, the way a
  # service manager would), subreaper, pidfd, PDEATHSIG, PID namespaces; plus the kit's own Linux shards.
  linux:
    name: Linux ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04, ubuntu-24.04-arm]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Crystal ${{ env.CRYSTAL_VERSION }}
        run: |
          set -euo pipefail
          base="https://github.com/crystal-lang/crystal/releases/download/${CRYSTAL_VERSION}"
          case "$(uname -m)" in
            x86_64)  asset="crystal-${CRYSTAL_VERSION}-1-linux-x86_64.tar.gz";  sum=08b5779df8cf280c4a799599862bbe4d42103ba082aa73429562713c8a9f3b43 ;;
            aarch64) asset="crystal-${CRYSTAL_VERSION}-1-linux-aarch64.tar.gz"; sum=a37365b79f58d4cd32b6113bbb9983e21eb41d233667e003c019520e3c245e49 ;;
          esac
          curl -fsSL -o crystal.tar.gz "$base/$asset"
          echo "$sum  crystal.tar.gz" | sha256sum -c -
          tar -xzf crystal.tar.gz -C "$HOME"
          echo "$HOME/crystal-${CRYSTAL_VERSION}-1/bin" >> "$GITHUB_PATH"

      - name: Platform
        run: |
          uname -a; id; cat /etc/os-release | head -2
          echo "self: $(cat /proc/self/cgroup)"
          echo "root controllers: $(cat /sys/fs/cgroup/cgroup.controllers)"
          echo "root subtree_control: $(cat /sys/fs/cgroup/cgroup.subtree_control)"
          systemctl --version | head -1
          for f in /proc/sys/kernel/apparmor_restrict_unprivileged_userns /proc/sys/user/max_user_namespaces /proc/sys/kernel/pid_max; do echo "$f=$(cat $f 2>/dev/null || echo absent)"; done
          free -m; swapon --show || true

      - name: Kit shard specs (process-handle, process-supervision)
        run: |
          set +e
          mkdir -p explore-out
          tag="linux-$(uname -m)-${{ matrix.runner }}"
          for s in process-handle process-supervision; do
            (cd probes/workspace/$s && sh scripts/verify.sh) > "explore-out/$tag-spec-$s.txt" 2>&1; echo "$s verify exit=$?"
            tail -n 5 "explore-out/$tag-spec-$s.txt"
          done

      - name: Build
        run: |
          mkdir -p explore-out/build
          cc -O1 -Wall -Wextra -o explore-out/build/cgroup_explore explore/linux/cgroup_explore.c
          cc -O1 -Wall -Wextra -pthread -o explore-out/build/linux_proc explore/linux/linux_proc.c
          cc -O1 -Wall -Wextra -pthread -o explore-out/build/linux_extras explore/linux/linux_extras.c
          CRYSTAL_PATH="$PWD/probes/workspace/process-supervision/src:$PWD/probes/workspace/process-handle/src:$(crystal env CRYSTAL_PATH)" \
            crystal build --no-color explore/linux/kit_linux.cr -o explore-out/build/kit_linux

      - name: Delegate a cgroup subtree to the runner user and run the probes inside it
        run: |
          set +e
          tag="linux-$(uname -m)-${{ matrix.runner }}"
          D=/sys/fs/cgroup/explore-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          sudo mkdir "$D" "$D/supervisor"
          for c in cpu memory pids; do
            grep -qw "$c" /sys/fs/cgroup/cgroup.subtree_control || echo "+$c" | sudo tee /sys/fs/cgroup/cgroup.subtree_control > /dev/null || echo "could not enable $c at the root"
          done
          sudo chown -R "$(id -u):$(id -g)" "$D"
          echo "+cpu +memory +pids" > "$D/cgroup.subtree_control" || echo "could not enable controllers in $D"
          echo "delegated $D: controllers=$(cat $D/cgroup.controllers) subtree_control=$(cat $D/cgroup.subtree_control)"
          sudo sh -c "echo $$ > $D/supervisor/cgroup.procs"
          echo "this shell is now in: $(cat /proc/$$/cgroup)"
          ./explore-out/build/cgroup_explore "$D" > "explore-out/$tag-cgroup_explore.jsonl" 2> "explore-out/$tag-cgroup_explore.err"; echo "cgroup_explore exit=$?"
          ./explore-out/build/linux_proc > "explore-out/$tag-linux_proc.jsonl" 2> "explore-out/$tag-linux_proc.err"; echo "linux_proc exit=$?"
          ./explore-out/build/kit_linux "$D" > "explore-out/$tag-kit_linux.jsonl" 2> "explore-out/$tag-kit_linux.err"; echo "kit_linux exit=$?"
          ./explore-out/build/linux_extras > "explore-out/$tag-linux_extras.jsonl" 2> "explore-out/$tag-linux_extras.err"; echo "linux_extras exit=$?"
          echo "left in $D: $(ls $D | grep -v '\.' | tr '\n' ' ')"

      - name: Show results
        if: always()
        run: |
          for f in explore-out/*.jsonl; do echo "=== $f"; cut -c1-700 "$f"; done
          for f in explore-out/*.err; do [ -s "$f" ] && { echo "=== $f"; head -c 3000 "$f"; }; done
          exit 0

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.runner }}
          path: |
            explore-out/*.jsonl
            explore-out/*.err
            explore-out/*.txt
          if-no-files-found: warn
          retention-days: 30

  windows:
    name: Windows ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            vcvars: vcvars64.bat
            unelevated: true
          - runner: windows-2022
            vcvars: vcvars64.bat
            unelevated: true
          - runner: windows-11-arm
            vcvars: vcvarsarm64.bat
            unelevated: false   # the unelevated launcher is a Crystal program; Crystal has no Windows arm64 build
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Build proc_explore (MSVC)
        run: |
          New-Item -ItemType Directory -Force explore-out | Out-Null
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          "visual_studio=$vs"
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\${{ matrix.vcvars }}"
          cmd /c "`"$vcvars`" >nul && cl /nologo /O1 /W3 /Fe:explore-out\proc_explore.exe explore\windows\proc_explore.c"
          if (-not (Test-Path explore-out\proc_explore.exe)) { throw "build failed" }
          cmd /c "`"$vcvars`" >nul && cl /nologo /O1 /W3 /Fe:explore-out\win_more.exe /Fo:explore-out\win_more.obj explore\windows\win_more.c"
          cmd /c "`"$vcvars`" >nul && cl /nologo /O1 /W3 /LD /Fe:explore-out\detach_dll.dll /Fo:explore-out\detach_dll.obj explore\windows\detach_dll.c"
          if (-not (Test-Path explore-out\win_more.exe) -or -not (Test-Path explore-out\detach_dll.dll)) { throw "win_more / detach_dll build failed" }
          $id = [Security.Principal.WindowsIdentity]::GetCurrent()
          "user=$($id.Name) arch=$env:PROCESSOR_ARCHITECTURE"
          [Environment]::OSVersion.VersionString

      - name: Run proc_explore groups (elevated, as the runner provides)
        timeout-minutes: 25
        run: |
          $exe = (Resolve-Path explore-out\proc_explore.exe).Path
          $tag = "windows-${{ matrix.runner }}-elevated"
          foreach ($g in "ctrl", "conpty", "parent", "wait", "rate", "mitigation", "debug", "silo", "period", "iorate", "iobw", "pipes", "pidreuse", "suspend", "wmclose", "appcontainer", "scale") {
            $t = [Diagnostics.Stopwatch]::StartNew()
            & $exe $g > "explore-out\$tag-$g.jsonl" 2> "explore-out\$tag-$g.err"
            "$g exit=$LASTEXITCODE seconds=$([int]$t.Elapsed.TotalSeconds) lines=$((Get-Content "explore-out\$tag-$g.jsonl").Count)"
          }

      # Job priority/affinity semantics, the session's token / window station / desktop, a test service in session 0,
      # and ExitProcess deadlocks in DLL detach (win_more.c; services need the elevated runner).
      - name: Run win_more groups (elevated)
        timeout-minutes: 25
        run: |
          $exe = (Resolve-Path explore-out\win_more.exe).Path
          $tag = "windows-${{ matrix.runner }}-elevated"
          foreach ($g in "priority", "desktop", "exitproc", "services") {
            $t = [Diagnostics.Stopwatch]::StartNew()
            & $exe $g > "explore-out\$tag-win_more-$g.jsonl" 2> "explore-out\$tag-win_more-$g.err"
            "$g exit=$LASTEXITCODE seconds=$([int]$t.Elapsed.TotalSeconds) lines=$((Get-Content "explore-out\$tag-win_more-$g.jsonl").Count)"
          }
          pwsh -NoProfile -NonInteractive -File explore\windows\pwsh_native.ps1 -Probe $exe > "explore-out\$tag-pwsh_native.jsonl" 2> "explore-out\$tag-pwsh_native.err"
          "pwsh_native exit=$LASTEXITCODE"

      - name: Session, runner service and crash-reporting settings
        run: |
          $out = "explore-out\windows-${{ matrix.runner }}-environment.txt"
          & {
            "== process chain from this step"
            $chain = @()
            $p = Get-CimInstance Win32_Process -Filter "ProcessId=$PID"
            for ($i = 0; $p -and $i -lt 12; $i++) {
              "{0,6} {1,-28} session={2} parent={3} created={4}" -f $p.ProcessId, $p.Name, $p.SessionId, $p.ParentProcessId, $p.CreationDate
              $chain += $p.ProcessId
              $pp = $p.ParentProcessId
              if ($chain -contains $pp) { break }
              $p = Get-CimInstance Win32_Process -Filter "ProcessId=$pp" -ErrorAction SilentlyContinue
            }
            "== services hosting a process of that chain, or named like the runner"
            Get-CimInstance Win32_Service | Where-Object { $chain -contains $_.ProcessId -or $_.Name -match "runner|actions|provision" } |
              Format-Table Name, State, StartMode, StartName, ProcessId -AutoSize | Out-String -Width 200
            "== explorer.exe"; Get-Process explorer -ErrorAction SilentlyContinue | Format-Table Id, SessionId -AutoSize | Out-String
            "== sessions"; query session 2>&1 | Out-String
            "== autologon"; Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon" | Select-Object AutoAdminLogon, DefaultUserName | Format-List | Out-String
            "== Windows Error Reporting"; Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting" -ErrorAction SilentlyContinue | Format-List | Out-String
            "== LocalDumps"; Get-ChildItem "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" -ErrorAction SilentlyContinue | Out-String
            "== service timeouts"; Get-ItemProperty "HKLM:\SYSTEM\CurrentControlSet\Control" | Select-Object WaitToKillServiceTimeout, ServicesPipeTimeout | Format-List | Out-String
          } *> $out
          Get-Content $out

      # Windows on Arm runs x64 and x86 programs under emulation: build the same probe for both and compare
      # how jobs, limits and accounting treat an emulated child.
      - name: x64 and x86 children on arm64 (emulation)
        if: runner.arch == 'ARM64'
        timeout-minutes: 15
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          $vcvarsall = Join-Path $vs "VC\Auxiliary\Build\vcvarsall.bat"
          foreach ($pair in @(@("arm64_amd64", "x64"), @("arm64_x86", "x86"))) {
            cmd /c "`"$vcvarsall`" $($pair[0]) >nul && cl /nologo /O1 /W3 /Fe:explore-out\proc_explore_$($pair[1]).exe /Fo:explore-out\proc_explore_$($pair[1]).obj explore\windows\proc_explore.c"
            "build $($pair[1]): exit=$LASTEXITCODE exists=$(Test-Path explore-out\proc_explore_$($pair[1]).exe)"
          }
          $env:PROC_EXPLORE_X64 = (Resolve-Path explore-out\proc_explore_x64.exe -ErrorAction SilentlyContinue).Path
          $env:PROC_EXPLORE_X86 = (Resolve-Path explore-out\proc_explore_x86.exe -ErrorAction SilentlyContinue).Path
          $exe = (Resolve-Path explore-out\proc_explore.exe).Path
          & $exe emulation > "explore-out\windows-${{ matrix.runner }}-elevated-emulation.jsonl" 2> "explore-out\windows-${{ matrix.runner }}-elevated-emulation.err"
          "emulation exit=$LASTEXITCODE lines=$((Get-Content "explore-out\windows-${{ matrix.runner }}-elevated-emulation.jsonl").Count)"

      - uses: ./.github/actions/setup-crystal-windows
        if: matrix.unelevated

      - name: Build the unelevated launcher (job_explore)
        if: matrix.unelevated
        id: launcher
        run: |
          crystal build --no-color explore/windows/job_explore.cr -o explore-out/job_explore.exe
          $je = (Resolve-Path explore-out\job_explore.exe).Path
          & $je launch-unelevated -- $je token > explore-out\launcher-token.jsonl
          $t = Get-Content explore-out\launcher-token.jsonl | Select-Object -First 1 | ConvertFrom-Json
          if ($t.token_is_elevated -ne 0) { throw "launcher produced an elevated token" }

      # The Crystal exploration tool's priority experiment, after the union-pointer fix, elevated and de-elevated.
      - name: job_explore priority (elevated and unelevated)
        if: matrix.unelevated && steps.launcher.outcome == 'success'
        timeout-minutes: 10
        run: |
          $je = (Resolve-Path explore-out\job_explore.exe).Path
          & $je priority > "explore-out\windows-${{ matrix.runner }}-elevated-job_explore_priority.jsonl" 2> "explore-out\windows-${{ matrix.runner }}-elevated-job_explore_priority.err"
          "elevated exit=$LASTEXITCODE"
          & $je launch-unelevated -- $je priority > "explore-out\windows-${{ matrix.runner }}-unelevated-job_explore_priority.jsonl" 2> "explore-out\windows-${{ matrix.runner }}-unelevated-job_explore_priority.err"
          "unelevated exit=$LASTEXITCODE"

      # pwsh under the fixed de-elevated token (the first attempts predate the token owner/default-DACL fix).
      - name: pwsh native commands under the de-elevated token
        if: matrix.unelevated && steps.launcher.outcome == 'success'
        timeout-minutes: 5
        run: |
          $je = (Resolve-Path explore-out\job_explore.exe).Path
          $script = (Resolve-Path explore\windows\pwsh_native.ps1).Path
          $probe = (Resolve-Path explore-out\win_more.exe).Path
          $pwsh = (Get-Command pwsh).Source
          & $je launch-unelevated -- $pwsh -NoProfile -NonInteractive -File $script -Probe $probe > "explore-out\windows-${{ matrix.runner }}-unelevated-pwsh_native.jsonl" 2> "explore-out\windows-${{ matrix.runner }}-unelevated-pwsh_native.err"
          "pwsh_native unelevated exit=$LASTEXITCODE"
          Get-Content "explore-out\windows-${{ matrix.runner }}-unelevated-pwsh_native.jsonl"

      - name: Crystal Process on Windows (crystal_spawn_win)
        if: matrix.unelevated
        run: |
          crystal build --no-color explore/windows/crystal_spawn_win.cr -o explore-out/crystal_spawn_win.exe
          $exe = (Resolve-Path explore-out\crystal_spawn_win.exe).Path
          & $exe > "explore-out\windows-${{ matrix.runner }}-crystal_spawn_win.jsonl" 2> "explore-out\windows-${{ matrix.runner }}-crystal_spawn_win.err"
          "crystal_spawn_win exit=$LASTEXITCODE"

      - name: Run proc_explore groups (unelevated, filtered token)
        if: matrix.unelevated && steps.launcher.outcome == 'success'
        timeout-minutes: 25
        run: |
          $exe = (Resolve-Path explore-out\proc_explore.exe).Path
          $je = (Resolve-Path explore-out\job_explore.exe).Path
          $tag = "windows-${{ matrix.runner }}-unelevated"
          foreach ($g in "ctrl", "conpty", "parent", "wait", "rate", "mitigation", "debug", "silo", "period", "iorate", "iobw", "pipes", "pidreuse", "suspend", "wmclose", "appcontainer", "scale") {
            $t = [Diagnostics.Stopwatch]::StartNew()
            & $je launch-unelevated -- $exe $g > "explore-out\$tag-$g.jsonl" 2> "explore-out\$tag-$g.err"
            "$g exit=$LASTEXITCODE seconds=$([int]$t.Elapsed.TotalSeconds) lines=$((Get-Content "explore-out\$tag-$g.jsonl").Count)"
          }
          $wm = (Resolve-Path explore-out\win_more.exe).Path
          foreach ($g in "priority", "desktop", "exitproc", "services") {
            $t = [Diagnostics.Stopwatch]::StartNew()
            & $je launch-unelevated -- $wm $g > "explore-out\$tag-win_more-$g.jsonl" 2> "explore-out\$tag-win_more-$g.err"
            "win_more $g exit=$LASTEXITCODE seconds=$([int]$t.Elapsed.TotalSeconds) lines=$((Get-Content "explore-out\$tag-win_more-$g.jsonl").Count)"
          }

      - name: Show results
        if: always()
        run: |
          Get-ChildItem explore-out\*.jsonl | ForEach-Object { "=== $($_.Name)"; Get-Content $_ | ForEach-Object { $_.Substring(0, [Math]::Min($_.Length, 600)) } }
          Get-ChildItem explore-out\*.err | Where-Object Length -gt 0 | ForEach-Object { "=== $($_.Name)"; Get-Content $_ -TotalCount 40 }

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.runner }}
          path: |
            explore-out/*.jsonl
            explore-out/*.err
            explore-out/*.txt
          if-no-files-found: warn
          retention-days: 30
