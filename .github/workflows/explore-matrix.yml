name: explore-matrix

# Standalone exploration probes (explore/) across OS versions and CPU architectures. Nothing here
# asserts: every probe writes JSON lines describing what the OS did, and the jobs only fail if a
# probe cannot be built at all. The kit's qualification runs stay in native-probes.yml.

on:
  workflow_dispatch:
  push:
    paths:
      - "explore/posix/**"
      - "explore/macos/**"
      - "explore/windows/proc_explore.c"
      - ".github/workflows/explore-matrix.yml"

permissions:
  contents: read

env:
  CRYSTAL_VERSION: "1.21.1"

jobs:
  posix:
    name: POSIX ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-14
          - macos-15
          - macos-15-intel
          - macos-26
          - macos-26-intel
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Crystal ${{ env.CRYSTAL_VERSION }}
        # used only by crystal_spawn.cr; a failure here leaves the C probes to run on their own
        continue-on-error: true
        run: |
          set -euo pipefail
          base="https://github.com/crystal-lang/crystal/releases/download/${CRYSTAL_VERSION}"
          case "$(uname -s)-$(uname -m)" in
            Darwin-*)       asset="crystal-${CRYSTAL_VERSION}-1-darwin-universal.tar.gz"; sum=ba34fa7fb8bc8b951f12d17e12f69c9d7ccce38900caa4b8a17f1b4f29d37605 ;;
            Linux-x86_64)   asset="crystal-${CRYSTAL_VERSION}-1-linux-x86_64.tar.gz";     sum=08b5779df8cf280c4a799599862bbe4d42103ba082aa73429562713c8a9f3b43 ;;
            Linux-aarch64)  asset="crystal-${CRYSTAL_VERSION}-1-linux-aarch64.tar.gz";    sum=a37365b79f58d4cd32b6113bbb9983e21eb41d233667e003c019520e3c245e49 ;;
            *) echo "no Crystal build for $(uname -sm)"; exit 1 ;;
          esac
          # SHA-256 values computed from the release assets when this workflow was written.
          curl -fsSL -o crystal.tar.gz "$base/$asset"
          echo "$sum  crystal.tar.gz" | shasum -a 256 -c -
          tar -xzf crystal.tar.gz -C "$HOME"
          echo "$HOME/crystal-${CRYSTAL_VERSION}-1/bin" >> "$GITHUB_PATH"

      - name: Platform
        run: |
          uname -a
          id
          cc --version | head -1
          command -v crystal && crystal --version | head -1 || echo "crystal: not installed"
          if command -v sw_vers > /dev/null; then sw_vers; else cat /etc/os-release | head -4; fi
          ulimit -a

      - name: POSIX probes
        run: sh explore/posix/run.sh explore-out

      - name: Process-group signalling matrix and kqueue zombie registration
        run: |
          tag="posix-$(uname -s)-$(uname -m)"
          cc -O1 -Wall -Wextra -o explore-out/build/signal_matrix explore/macos/signal_matrix.c
          ./explore-out/build/signal_matrix > "explore-out/$tag-signal_matrix.jsonl"
          cc -O1 -Wall -Wextra -o explore-out/build/kqueue_zombie explore/macos/kqueue_zombie.c
          ./explore-out/build/kqueue_zombie > "explore-out/$tag-kqueue_zombie.jsonl"
          wc -l explore-out/*.jsonl

      # Ubuntu 22.04 (glibc 2.35, kernel 6.8) gave EPERM from posix_spawn under RLIMIT_NPROC, 24.04 (glibc 2.39,
      # kernel 7.0) EAGAIN. Run the case with both releases' glibc on this runner's kernel to see which one matters.
      # seccomp is unconfined because Docker's default profile changes how glibc can create the child (clone3).
      - name: glibc vs kernel - posix_spawn errno under RLIMIT_NPROC
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          kernel=$(uname -r)
          for rel in 22.04 24.04; do
            bin="explore-out/build/rlimit-glibc-ubuntu-$rel"
            docker run --rm --security-opt seccomp=unconfined -v "$PWD":/w -w /w "ubuntu:$rel" sh -c \
              "apt-get update -qq > /dev/null && apt-get install -y -qq gcc libc6-dev > /dev/null && cc -O1 -o /w/$bin explore/posix/rlimit.c && ldd --version | head -1" \
              || { echo "container build failed for $rel"; continue; }
            out="explore-out/posix-Linux-x86_64-nproc-glibc-of-ubuntu-$rel-on-kernel-$kernel.jsonl"
            docker run --rm --security-opt seccomp=unconfined --user "$(id -u):$(id -g)" -v "$PWD":/w -w /w "ubuntu:$rel" "/w/$bin" --only nproc > "$out" 2>&1 || true
            echo "== ubuntu:$rel userland on kernel $kernel"; cat "$out"
          done

      - name: Show results
        if: always()
        run: |
          for f in explore-out/*.jsonl; do echo "=== $f"; cut -c1-600 "$f"; done
          for f in explore-out/*.err; do [ -s "$f" ] && { echo "=== $f"; head -c 3000 "$f"; }; done
          exit 0

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: posix-${{ matrix.runner }}
          path: |
            explore-out/*.jsonl
            explore-out/*.err
            explore-out/*.txt
          if-no-files-found: warn
          retention-days: 30

  windows:
    name: Windows ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            vcvars: vcvars64.bat
            unelevated: true
          - runner: windows-2022
            vcvars: vcvars64.bat
            unelevated: true
          - runner: windows-11-arm
            vcvars: vcvarsarm64.bat
            unelevated: false   # the unelevated launcher is a Crystal program; Crystal has no Windows arm64 build
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Build proc_explore (MSVC)
        run: |
          New-Item -ItemType Directory -Force explore-out | Out-Null
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          "visual_studio=$vs"
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\${{ matrix.vcvars }}"
          cmd /c "`"$vcvars`" >nul && cl /nologo /O1 /W3 /Fe:explore-out\proc_explore.exe explore\windows\proc_explore.c"
          if (-not (Test-Path explore-out\proc_explore.exe)) { throw "build failed" }
          $id = [Security.Principal.WindowsIdentity]::GetCurrent()
          "user=$($id.Name) arch=$env:PROCESSOR_ARCHITECTURE"
          [Environment]::OSVersion.VersionString

      - name: Run proc_explore groups (elevated, as the runner provides)
        timeout-minutes: 25
        run: |
          $exe = (Resolve-Path explore-out\proc_explore.exe).Path
          $tag = "windows-${{ matrix.runner }}-elevated"
          foreach ($g in "ctrl", "conpty", "parent", "wait", "rate", "mitigation", "debug", "silo", "period", "iorate") {
            $t = [Diagnostics.Stopwatch]::StartNew()
            & $exe $g > "explore-out\$tag-$g.jsonl" 2> "explore-out\$tag-$g.err"
            "$g exit=$LASTEXITCODE seconds=$([int]$t.Elapsed.TotalSeconds) lines=$((Get-Content "explore-out\$tag-$g.jsonl").Count)"
          }

      - uses: ./.github/actions/setup-crystal-windows
        if: matrix.unelevated

      - name: Build the unelevated launcher (job_explore)
        if: matrix.unelevated
        id: launcher
        run: |
          crystal build --no-color explore/windows/job_explore.cr -o explore-out/job_explore.exe
          $je = (Resolve-Path explore-out\job_explore.exe).Path
          & $je launch-unelevated -- $je token > explore-out\launcher-token.jsonl
          $t = Get-Content explore-out\launcher-token.jsonl | Select-Object -First 1 | ConvertFrom-Json
          if ($t.token_is_elevated -ne 0) { throw "launcher produced an elevated token" }

      - name: Run proc_explore groups (unelevated, filtered token)
        if: matrix.unelevated && steps.launcher.outcome == 'success'
        timeout-minutes: 25
        run: |
          $exe = (Resolve-Path explore-out\proc_explore.exe).Path
          $je = (Resolve-Path explore-out\job_explore.exe).Path
          $tag = "windows-${{ matrix.runner }}-unelevated"
          foreach ($g in "ctrl", "conpty", "parent", "wait", "rate", "mitigation", "debug", "silo", "period", "iorate") {
            $t = [Diagnostics.Stopwatch]::StartNew()
            & $je launch-unelevated -- $exe $g > "explore-out\$tag-$g.jsonl" 2> "explore-out\$tag-$g.err"
            "$g exit=$LASTEXITCODE seconds=$([int]$t.Elapsed.TotalSeconds) lines=$((Get-Content "explore-out\$tag-$g.jsonl").Count)"
          }

      - name: Show results
        if: always()
        run: |
          Get-ChildItem explore-out\*.jsonl | ForEach-Object { "=== $($_.Name)"; Get-Content $_ | ForEach-Object { $_.Substring(0, [Math]::Min($_.Length, 600)) } }
          Get-ChildItem explore-out\*.err | Where-Object Length -gt 0 | ForEach-Object { "=== $($_.Name)"; Get-Content $_ -TotalCount 40 }

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.runner }}
          path: |
            explore-out/*.jsonl
            explore-out/*.err
          if-no-files-found: warn
          retention-days: 30
